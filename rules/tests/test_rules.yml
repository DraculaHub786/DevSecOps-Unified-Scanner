# Test fixture for GitHub Actions security rules
name: Security Test
on:
  # ruleid: org-gha-dangerous-pull-request-target
  pull_request_target:
    types: [opened]

# ruleid: org-gha-write-all-permissions
permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # ruleid: org-gha-unpinned-action
      - uses: actions/checkout@v4

      - name: Safe Echo via Environment Variable
        env:
          # ok: org-gha-untrusted-event-injection
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "Safe title: $ISSUE_TITLE"

      - name: Command Injection
        run: |
          # ruleid: org-gha-untrusted-event-injection
          echo "${{ github.event.issue.title }}"
