name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@3041bf56c941b3916172d454dcd8f81a51be6948 # v5.2.0
        with:
          go-version-file: go.mod

      - name: Verify Code Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Scanner Checksum Consistency Validation
        run: bash scripts/verify-checksums.sh

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -race ./...

      - name: Vulnerability Check (govulncheck - pinned v1.1.4)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Build Sentinel Binary
        run: go build -o bin/sentinel ./cmd/sentinel

      - name: Setup Python for Semgrep
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Pinned Scanner Engines & Semgrep
        run: |
          bash plugins/install.sh
          . plugins/versions.env
          pip install --no-cache-dir "semgrep==${SEMGREP_VERSION}"
          echo "$PWD/plugins" >> $GITHUB_PATH

      - name: Rule Pack Loads in Real Semgrep
        run: |
          mkdir -p "$RUNNER_TEMP/rp" "$RUNNER_TEMP/empty"
          for f in rules/*.yml; do case "$(basename "$f")" in resilience*) ;; *) cp "$f" "$RUNNER_TEMP/rp/";; esac; done
          semgrep scan --metrics=off --disable-version-check --config "$RUNNER_TEMP/rp" "$RUNNER_TEMP/empty"

      - name: Rule Tests (Sentinel and Semgrep)
        run: ./bin/sentinel rules test --semgrep

      - name: Pull Request Security Flow
        run: bash scripts/pr-flow.sh

      - name: SARIF Output and Schema Check
        run: |
          ./bin/sentinel scan testdata/vulnerable-app --format sarif --out /tmp/test.sarif
          grep '"version": "2.1.0"' /tmp/test.sarif
          grep 'sarif-schema-2.1.0.json' /tmp/test.sarif

      - name: End-to-End Full Gate (e2e-full)
        run: bash scripts/e2e-full.sh

      - name: Acceptance Suite
        run: SKIP_ONLINE=1 BIN=./bin/sentinel bash scripts/acceptance.sh

      - name: Egress Test (Zero Network Verification)
        run: |
          sudo unshare -n ./bin/sentinel scan testdata/vulnerable-app --offline --format json --out /tmp/egress_report.json
          test -s /tmp/egress_report.json

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b3916172d454dcd8f81a51be6948 # v5.2.0
        with:
          go-version-file: go.mod
      - name: Cross-compile Sentinel (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -v -o /dev/null ./cmd/sentinel

  self-scan:
    needs: [test, cross-compile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@3041bf56c941b3916172d454dcd8f81a51be6948 # v5.2.0
        with:
          go-version-file: go.mod

      - name: Install Pinned Scanner Engines
        run: bash plugins/install.sh

      - name: Self-Scan Repository
        run: |
          go run ./cmd/sentinel scan . --ci --trust-repo-policy --fail-on=critical --format sarif --out results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9e8d0789d4a0fa618460e0086ab2d3ea880a416e # v3.26.0
        with:
          sarif_file: results.sarif

  extension-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f671b9cdc0f2d343334fe049ceb554f310bc # v4.2.0
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: extension-vscode
        run: npm ci
      - name: Build and test extension
        working-directory: extension-vscode
        run: npm test
      - name: Package extension (.vsix)
        working-directory: extension-vscode
        run: npm run package
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf6581a12fe429c0b151 # v4.4.3
        with:
          name: sentinel-vscode-extension
          path: extension-vscode/*.vsix
