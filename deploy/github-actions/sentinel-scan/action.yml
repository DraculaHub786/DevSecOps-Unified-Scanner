name: 'Sentinel DevSecOps Scanner'
description: 'Unified SAST, SCA, secrets, IaC, and resilience scanner with SARIF code scanning output and PR gating'
author: 'Sentinel Dev'
inputs:
  fail-on:
    description: 'Fail build if findings meet or exceed severity threshold (critical, high, medium, low)'
    required: false
    default: 'high'
  format:
    description: 'Report formats to generate (terminal, sarif, json, markdown)'
    required: false
    default: 'terminal,sarif,markdown'
  sarif-file:
    description: 'Path to write SARIF output'
    required: false
    default: 'results.sarif'
  target:
    description: 'Path or repository directory to scan'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install Sentinel
      shell: bash
      run: |
        go install github.com/sentinel-dev/sentinel/cmd/sentinel@latest

    - name: Run Sentinel Security Scan
      shell: bash
      run: |
        sentinel scan ${{ inputs.target }} \
          --ci \
          --fail-on=${{ inputs.fail-on }} \
          --format=${{ inputs.format }} \
          --out=${{ inputs.sarif-file }}

    - name: Upload SARIF report to GitHub Code Scanning
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
