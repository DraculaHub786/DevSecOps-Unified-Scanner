name: 'Sentinel DevSecOps Scanner'
description: 'Unified SAST, SCA, secrets, IaC and resilience scan that writes SARIF'
author: 'DraculaHub786'
# Usage in workflow:
#   permissions:
#     contents: read
#     security-events: write
#   steps:
#     - uses: actions/checkout@v4
#     - uses: DraculaHub786/DevSecOps-Unified-Scanner/deploy/github-actions/sentinel-scan@v0.1.2
#     - uses: github/codeql-action/upload-sarif@v3
#       if: always()
#       with:
#         sarif_file: results.sarif
inputs:
  fail-on:
    description: 'Fail at or above this severity (critical, high, medium, low)'
    required: false
    default: 'high'
  path:
    description: 'Directory to scan'
    required: false
    default: '.'
runs:
  using: 'docker'
  image: 'docker://ghcr.io/draculahub786/devsecops-unified-scanner:latest'
  args:
    - 'scan'
    - ${{ inputs.path }}
    - '--ci'
    - '--fail-on'
    - ${{ inputs.fail-on }}
    - '--format'
    - 'sarif'
    - '--out'
    - 'results.sarif'
