name: 'Sentinel DevSecOps Scanner'
description: 'Unified SAST, SCA, secrets, IaC, and resilience scanner with automated SARIF generation'
author: 'DraculaHub786'

inputs:
  fail-on:
    description: 'Fail at or above this severity threshold (critical, high, medium, low)'
    required: false
    default: 'high'
  path:
    description: 'Repository directory path to scan'
    required: false
    default: '.'
  format:
    description: 'Output format (sarif, json, terminal, markdown)'
    required: false
    default: 'sarif'
  out:
    description: 'Output file destination'
    required: false
    default: 'results.sarif'
  offline:
    description: 'Execute in strict offline mode with zero network egress'
    required: false
    default: 'false'

runs:
  using: 'docker'
  image: 'docker://ghcr.io/draculahub786/devsecops-unified-scanner:v1.0.1'
  args:
    - 'scan'
    - ${{ inputs.path }}
    - '--ci'
    - '--fail-on'
    - ${{ inputs.fail-on }}
    - '--format'
    - ${{ inputs.format }}
    - '--out'
    - ${{ inputs.out }}
