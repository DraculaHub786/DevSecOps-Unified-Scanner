version: 1
engine: "auto" # auto | external | embedded
scanners:
  sast:
    enabled: true
    ruleset: "auto"
    extra_rules:
      - "rules/sast-rules.yml"
  secrets:
    enabled: true
    scan_history: false
  sca:
    enabled: true
    fail_on_license:
      - "GPL-3.0"
  iac:
    enabled: true
  dast:
    enabled: false
    target: ""
    allowlist: []
    allow_private: false
  resilience:
    enabled: true

ignore:
  paths:
    - "vendor/**"
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - ".git/**"
    - "**/.sentinel/**"
    - "testdata/**"
    - "**/*_test.go"
  findings:
    - id: "SENT-b64f59dc55e7"
      reason: "Scanner regex pattern string in semgrep.go fallback engine"

thresholds:
  fail_on: "high"

output:
  formats:
    - "terminal"
    - "sarif"
    - "markdown"
  path: ".sentinel/reports/"

cloud:
  enabled: false
  endpoint: ""
