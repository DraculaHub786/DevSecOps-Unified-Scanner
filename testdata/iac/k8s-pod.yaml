apiVersion: v1
kind: Pod
metadata:
  name: vulnerable-pod
spec:
  containers:
    - name: app
      image: alpine:latest
      securityContext:
        privileged: true
        readOnlyRootFilesystem: false
        capabilities:
          add:
            - SYS_ADMIN
            - ALL
      command: ["sh", "-c", "sleep 3600"]
