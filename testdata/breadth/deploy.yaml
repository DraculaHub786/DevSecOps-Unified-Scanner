apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure
spec:
  template:
    spec:
      containers:
        - name: app
          image: nginx:latest
          securityContext:
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: true
          env:
            - name: DB_PASSWORD
              value: "hardcoded-pass-123"
---
apiVersion: v1
kind: Service
metadata:
  name: wide
spec:
  ports:
    - port: 22
      targetPort: 22
